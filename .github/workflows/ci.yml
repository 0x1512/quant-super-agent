name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: gate, forge and determinism tests (stdlib unittest, no deps)
        run: python -m unittest discover -s tests -v
      - name: lifecycle demo — honest run must merge
        run: python examples/run_lifecycle.py --work "$RUNNER_TEMP/demo-honest"
      - name: lifecycle demo — FIB 7 silent-pass must be blocked
        run: python examples/run_lifecycle.py --work "$RUNNER_TEMP/demo-fib7" --fib 7
      - name: mining demo — budget-bounded honest negative chain (it2/it3 deflation)
        run: python examples/run_mining.py
      - name: v0.4 ablation acceptance (roles x debate rounds)
        run: python examples/run_ablation.py
      - name: v0.5 settlement + calibration acceptance
        run: python examples/run_calibration.py
      - name: v0.6 FIB harness acceptance (20 injections x 2 baselines + gate)
        run: python examples/run_fib.py
      - name: v1.1 factor factory — 24 public-literature factors, fast lane (smoke, ~15s)
        run: |
          python examples/run_factory.py --work "$RUNNER_TEMP/factory1"
          cp -r "$RUNNER_TEMP/factory1" "$RUNNER_TEMP/factory1-copy"
          python examples/run_factory.py --work "$RUNNER_TEMP/factory1"
          diff -r "$RUNNER_TEMP/factory1" "$RUNNER_TEMP/factory1-copy" && echo FACTORY-BYTE-IDENTICAL
      - name: v1.0 Scenario A — report replication (fixture-pinned, offline; byte-identical double run)
        if: matrix.python-version == '3.12'
        run: |
          python examples/run_replication.py --work "$RUNNER_TEMP/rep1"  # ~19 min on 300 tickers x 5y
          cp -r "$RUNNER_TEMP/rep1" "$RUNNER_TEMP/rep1-copy"
          python examples/run_replication.py --work "$RUNNER_TEMP/rep1"
          diff -r "$RUNNER_TEMP/rep1" "$RUNNER_TEMP/rep1-copy" && echo BYTE-IDENTICAL
      - name: v0.7 budget estimators (discovery@B + alpha-frontier)
        run: |
          python examples/run_discovery.py
          python examples/run_frontier.py
      - name: ingest round-trip — user CSV must become a legal snapshot
        run: |
          python - <<'EOF'
          import csv
          with open("ci-prices.csv", "w", newline="") as f:
              w = csv.writer(f)
              w.writerow(["date", "ticker", "close"])
              for i in range(60):
                  d = f"2024-{(i // 28) + 1:02d}-{(i % 28) + 1:02d}"
                  for j, tk in enumerate(["AAA", "BBB", "CCC"]):
                      w.writerow([d, tk, 100.0 + i + j])
          EOF
          python -m qsa.ingest ci-prices.csv "$RUNNER_TEMP/ci-snapshot"
